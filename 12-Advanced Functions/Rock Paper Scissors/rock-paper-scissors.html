<!DOCTYPE html>
<html lang="en">

<head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="rock-paper-scissors.css">
</head>

<body>
    <h1>Rock Paper Scissors</h1>
    <p>
        <button  class="move-button rock"><img class="move" src="rock.png"></button>
        <button  class="move-button paper"><img class="move" src="paper.png"></button>
        <button  class="move-button scissors"><img class="move" src="scissors.png"></button>
    </p>
    <h2 class="js-result"></h2>
    <p class="js-moveRemarks"></p>
    <p class="js-score"></p>
    <button class="reset">Reset Score</button>
    <button class="auto-play" >Autoplay</button>
    <p class="resetConfirmation"></p>
    <script src="rock-paper-scissors.js">
    </script>
</body>

</html>
