<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const xhr = new XMLHttpRequest();
        xhr.addEventListener('load', () => {
            console.log(xhr.response);
        })
        xhr.open('POST', 'https://supersimplebackend.dev/greeting');
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.send(JSON.stringify({ name: "Naitik Nandan" }));
        function response() {
            fetch('https://supersimplebackend.dev/greeting').then(async (response) => {
                console.log(await (response.text()));
            });
        }
        response();
        async function myName() {
            const response = await fetch('https://supersimplebackend.dev/greeting', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: "Naitik Nandan"
                })
            });
            const name = await response.text();
            console.log(name);
        };
        myName();

        async function myAmazon() {
            try {
                const response = await fetch('https://amazon.in');
                console.log(await response.json())
            } catch (error) {
                console.log('CORS Error. Your Request was blocked by the backend');
            }
        };
        myAmazon();

        async function myNameNot() {
            try {
                const response = await fetch('https://supersimplebackend.dev/greeting', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                });
                if (response.status >= 400)
                    throw response;
                console.log(response.text());
            } catch (error) {
                if (error.status === 400)
                    console.log(await error.text())
                else
                console.log('Network Error. Please Try Again Later');
            }
        };
        myNameNot();
    </script>
</body>

</html>
