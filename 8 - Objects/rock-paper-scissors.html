<!DOCTYPE html>
<html lang="en">

<head>
    <title>Rock Paper Scissors</title>
</head>

<body>
    <p>Rock Paper Scissors</p>
    <p>
        <button onclick="playGame('rock')">Rock</button>
        <button onclick="playGame('paper')">Paper</button>
        <button onclick="playGame('scissors')">Scissors</button>
        <button onclick="reset();">Reset</button>
    </p>
    <script>

        let score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            losses: 0,
            ties: 0
        }

        function computerMover() {
            let computerMove = Math.random();
            //console.log(computerMove);
            if (computerMove <= (0.3))
                computerMove = 'rock';
            else if (computerMove <= (0.6) && computerMove > (0.3))
                computerMove = 'paper';
            else if (computerMove > (0.6))
                computerMove = 'scissors';
            return computerMove;
        }

        function playGame(move) {

            let copyScore = {
                wins: score.wins,
                losses: score.losses,
                ties: score.ties
            };

            const computerMove = computerMover();
            if (move === 'paper') {
                if (computerMove === 'paper')
                    score.ties += 1;
                else if (computerMove === 'rock')
                    score.wins += 1;
                else
                    score.losses += 1;
            }

            if (move === 'scissors') {
                if (computerMove === 'scissors')
                    score.ties += 1;
                else if (computerMove === 'paper')
                    score.wins += 1;
                else
                    score.losses += 1;
            }

            if (move === 'rock') {
                if (computerMove === 'rock')
                    score.ties += 1;
                else if (computerMove === 'scissors')
                    score.wins += 1;
                else
                    score.losses += 1;
            }

            let result = '';
            if (score.wins - copyScore.wins === 1)
                result = 'You Win!';
            else if (score.losses - copyScore.losses === 1)
                result = 'You Loose!';
            else if (score.ties - copyScore.ties === 1)
                result = 'TIE!';

            alert(`${result}
Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);

            localStorage.setItem('score', JSON.stringify(score));

        }

        function reset() {
            score.wins = 0;
            score.losses = 0;
            score.ties = 0;
            alert(`Score Reset!
Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
        }
    </script>
</body>

</html>
