<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise - Arrays & Loops</title>
</head>

<body>
    <script>
        const nums = [10, 20, 30];
        nums[2] = 99;
        function getLastValue(array) {
            return array[array.length - 1];
        }
        console.log(getLastValue(nums));
        function arraySwap(array) {
            const l = array.length - 1;
            array[0] *= array[l];
            array[l] = array[0] / array[l]
            array[0] = array[0] / array[l];
            return array;
        }
        console.log(arraySwap(nums));
        let i = 0;
        for (i = 0; i <= 10; i += 2)
            console.log(i);
        for (i = 5; i >= 0; i--)
            console.log(i);
        i = 0;
        while (i <= 10) {
            console.log(i);
            i += 2;
        }
        while (i <= 10) {
            console.log(i);
            i += 2;
        }
        i = 5;
        while (i >= 0) {
            console.log(i);
            i--;
        }

        function addOne(array) {
            for (i = 0; i < array.length; i++)
                array[i]++;
            return array;
        }

        console.log(addOne(nums));

        function addNum(array, num) {
            for (i = 0; i < array.length; i++)
                array[i] += num;
            return array;
        }
        console.log(addNum(nums, 2));

        function addArrays(ar1, ar2) {
            const array = [];
            if (ar1.length === ar2.length) {
                for (i = 0; i < ar1.length; i++)
                    array.push(ar1[i] + ar2[i]);
                return array;
            }
            else
                return 'Lengths are not equal';
        }

        console.log(addArrays(nums, [1, 2, 3]));

        function countPositive(num) {
            k = 0;
            for (i = 0; i < num.length; i++)
                if (num[i] > 0)
                    k++;
            return k;
        }
        console.log(countPositive(nums));
        console.log(nums);
        function minMax(array) {
            if (array.length === 0)
                array[0] = null;
            let minMax = {
                min: array[0],
                max: array[0]
            }
            for (i = 0; i < array.length; i++) {
                if (array[i] < minMax.min)
                    minMax.min = array[i];
                if (array[i] > minMax.max)
                    minMax.max = array[i];
            }
            return minMax;
        }
        console.log(minMax(nums));
        console.log(minMax([3]));
        console.log(minMax([]));
        const arS = ['apple', 'apple', 'mango'];
        function countWords(array) {
            const obS = {};
            for (i = 0; i < array.length; i++) {
                if (!obS[array[i]])
                    obS[array[i]] = 1;
                else
                    obS[array[i]]++;
            }
            return obS;
        }

        console.log(countWords(arS));
        function findIndex(array, word) {
            let k = -1;
            for (i = 0; i < array.length; i++) {
                if (word === array[i]) {
                    k = i;
                    break;
                }
            }
            console.log(k);
        }
        findIndex(arS, 'pea');
        function unique(array) {
            const newArray = [array[0]];
            for(i=0; i<array.length; i++) {
                word = array[i];
                let k = -1;
                for(let j =0; j<newArray.length; j++){
                    if(word === newArray[j])
                    k++;
                }
                if(k===-1){
                    newArray.push(word);
                }
            }
            return newArray;
        }
        console.log(unique(['green' , 'red', 'blue', 'red']));

        function removeEgg(foods) {
            foods = foods.slice().reverse();
            const newFoods = [];
            let eggCounter = 0;
            for (i = 0; i < foods.length; i++) {
                if (foods[i] != 'egg')
                    newFoods.push(foods[i]);
                if (foods[i] === 'egg') {
                    if (eggCounter < 2)
                        eggCounter++;
                    else
                        newFoods.push(foods[i]);
                }
            }
            console.log(foods);
            console.log(newFoods)
            return newFoods.reverse();
        }

        food = ['egg', 'apple', 'ham', 'egg', 'egg']
        console.log(removeEgg(food));
        console.log(food)

        for (i = 1; i <= 20; i++) {
            if (i % 3 === 0 && i % 5 === 0) {
                console.log('FizzBuzz');
                continue;
            }
            else if (i % 3 === 0) {
                console.log('Fizz');
                continue;
            }
            else if (i % 5 === 0) {
                console.log('Buzz');
                continue;
            }
            else
            console.log(i);

        }
    </script>
