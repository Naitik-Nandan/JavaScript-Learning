<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays & Loops</title>
</head>
<body>
    <script>
        const arr = [1,2, 'hello' , null , [1,2], {name: 'Naitik'}];
        console.log(arr.length);
        console.log(typeof arr);
        console.log(typeof arr[3]);
        arr.splice(3,1);
        console.log(arr);
        arr.push('Swimming');
        console.log(arr);
    </script>
</body>
